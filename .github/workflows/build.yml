name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flet-cli

      - name: Show tool versions
        run: |
          python --version
          flet --version || true
          flutter --version || true
          java -version 2>&1 || true

      - name: Build APK
        # flet asks "Proceed? [y/n]" when it wants Flutter. CI has no keyboard,
        # so answer "y" automatically.
        shell: bash
        run: |
          set -o pipefail
          echo y | flet build apk -v 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: tetomidi-apk
          path: build/apk/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
