name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip show flet

      # Fail fast with a clear message if any .py file is broken or cut off
      # (a SyntaxError here would otherwise only show up as a confusing
      # error deep inside "flet build").
      - name: Check Python syntax
        run: python -m compileall -q main.py core mobile

      # Ask the installed Flet which Flutter it needs, so Flutter and Flet
      # always match and Flet never has to download its own Flutter.
      - name: Find the Flutter version Flet needs
        id: fv
        run: |
          v=$(python -c "import flet.version as v; print(v.flutter_version)" 2>/dev/null || true)
          if [ -z "$v" ]; then v="3.44.8"; fi
          echo "Flutter version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          cache: true

      - name: Turn off Linux desktop target (app is Android only)
        run: flutter config --no-enable-linux-desktop

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      - name: Show tool versions
        run: |
          python --version
          flet --version || true
          flutter --version || true
          java -version 2>&1 || true

      - name: Build APK
        shell: bash
        run: |
          # GitHub runs bash with "-e -o pipefail". "yes" is killed by SIGPIPE
          # (exit 141) as soon as flet exits, and with pipefail that made this
          # step fail even when flet succeeded. Turn both off and read flet's
          # own exit code from PIPESTATUS instead.
          set +e +o pipefail
          # flet may ask several [y/n] questions; answer "y" to all of them.
          yes y | flet build apk -v 2>&1 | tee build.log
          status=${PIPESTATUS[1]}
          echo "flet exit code: $status"
          exit $status

      - name: Collect every log file Flet wrote (on failure)
        if: failure()
        shell: bash
        run: |
          mkdir -p diag
          find build "$HOME/.flet" -type f \( -name "*.log" -o -name "*.txt" -o -name "*.err" -o -name "*.out" \) 2>/dev/null \
            -exec cp --parents {} diag/ \; || true
          echo "Files collected:"
          find diag -type f | head -100 || true

      - name: Show end of build log when the build fails
        if: failure()
        shell: bash
        run: tail -n 150 build.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flet-diagnostics
          path: diag
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: tetomidi-apk
          path: build/apk/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
