name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flet-cli

      - name: Build APK
        run: flet build apk -v

      - uses: actions/upload-artifact@v4
        with:
          name: tetomidi-apk
          path: build/apk/*.apk
          if-no-files-found: error
          compression-level: 0
