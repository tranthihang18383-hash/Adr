[project]
name = "tetomidi"
version = "1.0.0"
description = "Audio to MIDI transcriber"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.4",
    "mutagen",
    "certifi",
]

[tool.flet]
org = "com.tetomidi"
product = "tetomidi"
company = "tetomidi"
copyright = "2026"
# Nền đen cho icon Android (adaptive icon) cho khớp với icon.png
icon_background = "#000000"

[tool.flet.app]
path = "."
